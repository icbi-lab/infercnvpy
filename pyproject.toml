[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "infercnvpy"
description = """\
  Infercnv is a scalable python library to infer copy number variation (CNV) events from single cell transcriptomics \
  data. It is heavliy inspired by InferCNV, but plays nicely with scanpy and is much more scalable.\
  """
readme = "README.md"
license = { file = "LICENSE" }
maintainers = [
  { name = "Gregor Sturm", email = "mail@gregor-sturm.de" },
]
authors = [
  { name = "Gregor Sturm" },
]
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dynamic = [ "version" ]
dependencies = [
  "anndata>=0.12",
  "leidenalg>=0.11",
  "matplotlib>=3.10",
  "numpy>=2.2",
  "pandas>=2.3",
  "pooch>=1.8",
  "pybiomart>=0.2",
  "pycairo>=1.20; sys_platform=='win32'",
  "rdata>=1",                             # MIT; reads SCEVAN .RData files
  "scanpy>=1.11",
  "scipy>=1.15",
  # the shared `scverse` logger and the example dataset registry
  "scverse-misc[datasets]>=0.1.8",
  # for debug logging (referenced from the issue template)
  "session-info2>=0.2",
  "tqdm>=4.67",
]
optional-dependencies.copykat = [ "rpy2" ]
optional-dependencies.gtf = [ "gtfparse>=3" ]
# https://docs.pypi.org/project_metadata/#project-urls
urls.Changelog = "https://github.com/scverse/infercnvpy/releases"
urls.Documentation = "https://infercnvpy.readthedocs.io/"
urls.Forum = "https://discourse.scverse.org/"
urls.Homepage = "https://github.com/scverse/infercnvpy"
urls.Issues = "https://github.com/scverse/infercnvpy/issues"
urls.Source = "https://github.com/scverse/infercnvpy"
contributors = [
  { name = "Grant Neilson", email = "grant.neilson5@gmail.com" },
]

[dependency-groups]
dev = [
  "twine>=4.0.2",
]
test = [
  "coverage>=7.10",
  "openpyxl>=3.1",         # required for one of the scanpy datasets used in the tests
  "pytest>=9.1",           # caplog captures loggers that do not propagate (scverse)
  "pytest-benchmark>=5.1",
  "pytest-cov>=6",         # For VS Code’s coverage functionality
]
doc = [
  "ipykernel",
  "ipython",
  "pandas",
  "scverse-doc[full]>=0.5",
  "scverse-misc[sphinx]>=0.1.8",
  "sphinx-autodoc-typehints",
  "sphinxcontrib-bibtex>=1",
]
typecheck = [
  "mypy",
  "pandas-stubs",
]

[tool.hatch]
version.source = "vcs"
version.raw-options.git_describe_command = "git describe --dirty --tags --long --match v*"
build.targets.sdist.exclude = [ "/docs", "/tests" ]
envs.default.installer = "uv"
envs.default.dependency-groups = [ "dev" ]
envs.docs.scripts.build = "sphinx-build -M html docs docs/_build -W {args}"
envs.docs.scripts.clean = "git clean -fdX -- {args:docs}"
envs.docs.scripts.open = "python -m webbrowser -t docs/_build/html/index.html"
envs.docs.dependency-groups = [ "doc" ]
envs.hatch-check-code.dependencies = [ "prek" ]
envs.hatch-check-code.scripts.lint-check = "echo 'try `hatch check code --fix`'; false"
envs.hatch-check-code.scripts.lint-fix = "prek run -a --no-group=format --no-group=typecheck"
envs.hatch-check-fmt.dependencies = [ "prek" ]
envs.hatch-check-fmt.scripts.format-check = "echo 'try `hatch check fmt --fix`'; false"
envs.hatch-check-fmt.scripts.format-fix = "prek run -a --group=format --no-group=typecheck"
envs.hatch-check-types.scripts.check = [ "mypy" ]
envs.hatch-check-types.dependency-groups = [ "typecheck", "test" ]
# Install the `gtf` extra so `tests/test_io.py::test_get_genomic_position_from_gtf` can run.
# The `copykat` extra (rpy2 + R) is intentionally omitted: `test_copykat` is skipped on CI
# and both rpy2 and gtfparse are imported lazily, so the base import works without them.
envs.hatch-test.features = [ "gtf" ]
envs.hatch-test.matrix = [
  # Test the lowest and highest supported Python versions with normal deps
  { deps = [ "stable" ], python = [ "3.13", "3.14" ] },
  # Test the newest supported Python version also with pre-release deps
  { deps = [ "pre" ], python = [ "3.14" ] },
  # Test the lowest supported Python version with the minimum versions of direct deps (SPEC 0)
  { deps = [ "min" ], python = [ "3.13" ] },
]
# `pre` allows pre-releases, `min` resolves every direct dependency to its lower bound.
envs.hatch-test.overrides.matrix.deps.env-vars = [
  { value = "allow", key = "UV_PRERELEASE", if = [ "pre" ] },
  { value = "lowest-direct", key = "UV_RESOLUTION", if = [ "min" ] },
]
envs.hatch-test.dependency-groups = [ "dev", "test" ]

[tool.ruff]
line-length = 120
src = [ "src" ]
extend-include = [ "*.ipynb" ]
format.docstring-code-format = true
lint.select = [
  "B",      # flake8-bugbear
  "BLE",    # flake8-blind-except
  "C4",     # flake8-comprehensions
  "D",      # pydocstyle
  "E",      # Error detected by Pycodestyle
  "F",      # Errors detected by Pyflakes
  "I",      # isort
  "RUF100", # Report unused noqa directives
  "TID",    # flake8-tidy-imports
  "UP",     # pyupgrade
  "W",      # Warning detected by Pycodestyle
]
lint.ignore = [
  "B008", # Errors from function calls in argument defaults. These are fine when the result is immutable.
  "D100", # Missing docstring in public module
  "D104", # Missing docstring in public package
  "D105", # __magic__ methods are often self-explanatory, allow missing docstrings
  "D107", # Missing docstring in __init__
  # Disable one in each pair of mutually incompatible rules
  "D203", # We don’t want a blank line before a class docstring
  "D213", # <> We want docstrings to start immediately after the opening triple quote
  "D400", # first line should end with a period [Bug: doesn’t work with single-line docstrings]
  "D401", # First line should be in imperative mood; try rephrasing
  "E501", # line too long -> we accept long comment lines; formatter gets rid of long code lines
  "E731", # Do not assign a lambda expression, use a def -> lambda expression assignments are convenient
  "E741", # allow I, O, l as variable names -> I is the identity matrix
]
lint.per-file-ignores."*/__init__.py" = [ "F401" ]
lint.per-file-ignores."docs/*" = [ "I" ]
lint.per-file-ignores."tests/*" = [ "D" ]
lint.pydocstyle.convention = "numpy"

[tool.mypy]
files = [ "src", "tests" ]
overrides = [
  # Third-party packages that ship no type information (scipy-stubs types sparse matrices without their methods)
  { module = [ "anndata.*", "gtfparse.*", "leidenalg.*", "pooch.*", "rpy2.*", "scanpy.*", "scipy.*", "tqdm.*" ], ignore_missing_imports = true },
]

[tool.pytest]
addopts = [
  "--import-mode=importlib", # allow using test files with same name
  "--benchmark-skip",        # run the benchmarks with `--benchmark-only`
]
markers = [
  "internet: tests which rely on internet resources (enable with `--internet-tests`)",
]
strict = true
testpaths = [ "tests" ]

[tool.coverage]
run.source = [ "infercnvpy" ]
run.omit = [
  "**/test_*.py",
]
run.patch = [ "subprocess" ]

[tool.cruft]
skip = [
  ".git",
  "tests",
  "src/**/__init__.py",
  "src/**/basic.py",
  "CHANGELOG.md",
  "docs/api",
  "docs/api.md",
  "docs/changelog.md",
  "docs/references.bib",
  "docs/references.md",
  "docs/notebooks/example.ipynb",
]
